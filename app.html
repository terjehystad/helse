<script>

/* ---------- date utils ---------- */
function d2(n){return(n<10?'0':'')+n}
function toDate(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fromDate(t){return t.getFullYear()+'-'+d2(t.getMonth()+1)+'-'+d2(t.getDate())}
function addDays(s,n){const t=toDate(s);t.setDate(t.getDate()+n);return fromDate(t)}

function isoWeek(s){const t=toDate(s);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)}

/* ---------- aggregation ---------- */
function vals(col,filter){return R.filter(filter).map(r=>r[col]).filter(x=>x!=null)}
function stat(arr){if(!arr.length)return null;const s=arr.reduce((a,b)=>a+b,0);return{n:arr.length,mean:s/arr.length,min:Math.min(...arr),max:Math.max(...arr),last:arr[arr.length-1]}}
function lastVal(col,skipToday){const idag=fromDate(new Date());for(let i=R.length-1;i>=0;i--){if(skipToday&&R[i].d===idag)continue;if(R[i][col]!=null)return{v:R[i][col],d:R[i].d}}return{v:null,d:null}}

function chipHtml(cur,prev,hb){if(cur==null||prev==null)return '<span class="chip fl">–</span>';const dd=cur-prev;if(Math.abs(dd)<Math.abs(cur||1)*.005)return '<span class="chip fl">→</span>';const up=dd>0,good=(up===hb);return `<span class="chip ${good?'up':'dn'}">${up?'▲':'▼'} ${fmt(Math.abs(dd),1)}</span>`}

/* ---------- charts ---------- */
function lineChart(points,hb,h){
 h=h||120;const W=320,pl=34,pr=8,pt=10,pb=18;
 const ys=points.map(p=>p[1]).filter(v=>v!=null);
 if(ys.length<2)return '<div class="muted small center" style="padding:20px">for lite data</div>';
 let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}const pad=(mx-mn)*.12;mn-=pad;mx+=pad;
 const n=points.length,X=i=>pl+(n<=1?0:i/(n-1)*(W-pl-pr)),Y=v=>pt+(1-(v-mn)/(mx-mn))*(h-pt-pb);
 let d='',started=false,firstI=null,lastI=null;
 points.forEach((p,i)=>{if(p[1]==null)return;d+=(started?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)+' ';started=true;if(firstI==null)firstI=i;lastI=i});
 const first=points[firstI][1],last=points[lastI][1];const up=last>first,col=(up===hb)?'var(--good)':'var(--warn)';
 const area=d+`L${X(lastI).toFixed(1)} ${h-pb} L${X(firstI).toFixed(1)} ${h-pb} Z`;
 let g='';[0,.5,1].forEach(f=>{const yy=pt+f*(h-pt-pb),vv=mx-(mx-mn)*f;g+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="var(--line)"/><text x="2" y="${yy+3}" fill="var(--dim)" font-size="9">${fmt(vv,1)}</text>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="height:${h}px">${g}<path d="${area}" fill="${col}" opacity=".08"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2"/><circle cx="${X(lastI).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="3" fill="${col}"/><text x="${pl}" y="${h-4}" fill="var(--dim)" font-size="9">${points[0][0]}</text><text x="${W-pr}" y="${h-4}" fill="var(--dim)" font-size="9" text-anchor="end">${points[n-1][0]}</text></svg>`;
}
function spark(arr,hb){const pts=arr.map((v,i)=>[i,v]).filter(p=>p[1]!=null);if(pts.length<2)return '';const W=120,H=34;const ys=pts.map(p=>p[1]);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}const n=arr.length,X=i=>i/(n-1)*W,Y=v=>4+(1-(v-mn)/(mx-mn))*(H-8);let d='';pts.forEach((p,k)=>d+=(k?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)+' ');const up=pts[pts.length-1][1]>pts[0][1];return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px"><path d="${d}" fill="none" stroke="${(up===hb)?'var(--good)':'var(--warn)'}" stroke-width="2"/></svg>`}

function hrCurve(hrs){if(!hrs||hrs.length<2)return '';const W=300,H=56;let mn=Math.min(...hrs),mx=Math.max(...hrs);if(mn===mx){mn-=1;mx+=1}const n=hrs.length,X=i=>i/(n-1)*W,Y=v=>4+(1-(v-mn)/(mx-mn))*(H-8);let d='';hrs.forEach((v,i)=>d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ');return `<div class="muted small" style="margin-top:8px">Pulskurve ${Math.round(mn)}–${Math.round(mx)}</div><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px"><path d="${d}" fill="none" stroke="var(--warn)" stroke-width="2"/></svg>`}
function elevSvg(a){if(!a||a.length<2)return '';const W=300,H=44;let mn=Math.min(...a),mx=Math.max(...a);if(mn===mx){mn-=1;mx+=1}const n=a.length,X=i=>i/(n-1)*W,Y=v=>4+(1-(v-mn)/(mx-mn))*(H-8);let d='M0 '+Y(a[0]).toFixed(1);a.forEach((v,i)=>{if(i)d+='L'+X(i).toFixed(1)+' '+Y(v).toFixed(1)});d+=`L${W} ${H} L0 ${H} Z`;return `<div class="muted small" style="margin-top:6px">Høyde ${Math.round(mn)}–${Math.round(mx)} m</div><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px"><path d="${d}" fill="var(--acc)" opacity=".18" stroke="var(--acc)" stroke-width="1.4"/></svg>`}
function routeSvg(rt){if(!rt||rt.length<2)return '';const la0=(Math.min(...rt.map(p=>p[0]))+Math.max(...rt.map(p=>p[0])))/2,kx=Math.cos(la0*Math.PI/180);const xs=rt.map(p=>p[1]*kx),ys=rt.map(p=>p[0]);const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);const w=(mxx-mnx)||1e-6,h=(mxy-mny)||1e-6,pad=8,S=260,sc=Math.min(S/w,S/h);const W=w*sc+2*pad,H=h*sc+2*pad,X=x=>pad+(x-mnx)*sc,Y=y=>H-pad-(y-mny)*sc;let d='';rt.forEach((p,i)=>d+=(i?'L':'M')+X(p[1]*kx).toFixed(1)+' '+Y(p[0]).toFixed(1)+' ');return `<div class="muted small" style="margin-top:8px">Rute</div><svg class="chart" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" style="max-height:230px;width:100%"><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(rt[0][1]*kx).toFixed(1)}" cy="${Y(rt[0][0]).toFixed(1)}" r="4" fill="var(--good)"/><circle cx="${X(rt[rt.length-1][1]*kx).toFixed(1)}" cy="${Y(rt[rt.length-1][0]).toFixed(1)}" r="4" fill="var(--warn)"/></svg>`}
function woDetail(x){const rows=[['Distanse',x.km?fmt(x.km,2)+' km':0],['Snittpuls',x.hr?x.hr+' /min':0],['Makspuls',x.hrmax?x.hrmax+' /min':0],['Snittfart',x.spd?fmt(x.spd,1)+' km/t':0],['Energi',x.kc?x.kc+' kcal':0],['Skritt',x.steps?fmt(x.steps,0):0],['Kadens',x.cad?x.cad+' spm':0],['Høyde ↑',x.up?x.up+' m':0],['Trapper',x.fl||0],['Tid',x.s&&x.e?x.s+'–'+x.e:0]].filter(r=>r[1]);const kv=rows.map(r=>`<div class="kv" style="display:flex;justify-content:space-between;font-size:12.5px;background:var(--card2);border-radius:9px;padding:6px 10px"><span class="muted">${r[0]}</span><b>${r[1]}</b></div>`).join('');return `<div style="padding:8px 0">${hrCurve(x.hrs)}${ruteKart(x.rt)}${elevSvg(x.alt)}<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">${kv}</div></div>`}
function tgl(id){const e=document.getElementById(id);if(e)e.style.display=e.style.display==='none'?'block':'none'}
let _mapReg={},_mapN=0;
function ruteKart(rt){if(!rt||rt.length<2)return '';const id='lmap'+(++_mapN);_mapReg[id]=rt;return `<div class="muted small" style="margin-top:8px">Kart</div><div id="${id}" class="lmap"></div>`;}
function tglKart(id){tgl(id);setTimeout(initSynligeKart,60);}
function initSynligeKart(){document.querySelectorAll('.lmap').forEach(el=>{
 if(el._init||el.offsetParent===null)return;const rt=_mapReg[el.id];if(!rt||rt.length<2)return;el._init=1;
 if(typeof L==='undefined'){el.innerHTML=routeSvg(rt);return;}
 try{
  const pts=rt.map(p=>[p[0],p[1]]);
  const map=L.map(el,{zoomControl:true,attributionControl:true});
  const poly=L.polyline(pts,{color:'#5b8cff',weight:4,opacity:.9}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
  map.fitBounds(poly.getBounds(),{padding:[18,18]});
  L.circleMarker(pts[0],{radius:6,color:'#fff',weight:2,fillColor:'#37b24d',fillOpacity:1}).addTo(map);
  L.circleMarker(pts[pts.length-1],{radius:6,color:'#fff',weight:2,fillColor:'#f03e3e',fillOpacity:1}).addTo(map);
  setTimeout(()=>map.invalidateSize(),60);
 }catch(e){el.innerHTML=routeSvg(rt);}
});}

/* ---------- readiness ---------- */
function readiness(){
 const l=lastVal('sl',false),h=lastVal('hrv',false),rp=lastVal('rhr',false),dpv=lastVal('dp',false);
 const hb=windowMean('hrv',30),rb=windowMean('rhr',30);
 // Vekting fra langtidsanalysen: hvilepuls tyngst (r −0,65), så HRV + dyp søvn, totalsøvn minst.
 let num=0,den=0,parts=[],drv=[];
 function add(w,s,label,val){num+=w*s;den+=w;parts.push([label,val]);drv.push([s,label]);}
 if(rp.v!=null&&rb)add(3,Math.max(0,Math.min(1,rb/rp.v)),'Hvilepuls',Math.round(rp.v));
 if(h.v!=null&&hb)add(2,Math.max(0,Math.min(1,h.v/(hb*1.1))),'HRV',Math.round(h.v)+' ms');
 if(dpv.v!=null)add(2,Math.max(0,Math.min(1,dpv.v/1.2)),'Dyp søvn',fmt(dpv.v,1)+' t');
 if(l.v!=null)add(1,Math.max(0,Math.min(1,(l.v-4)/(7.5-4))),'Søvn',fmt(l.v,1)+' t');
 const score=den?Math.round(num/den*100):null;
 let note='';if(drv.length){drv.sort((a,b)=>a[0]-b[0]);note=drv[0][0]<0.6?('Trekkes ned av '+drv[0][1].toLowerCase()+'.'):'Bryterne peker riktig vei.';}
 let lab='—',col='var(--mut)';
 if(score!=null){if(score>=70){lab='Klar for økt';col='var(--good)'}else if(score>=50){lab='Moderat — hold igjen litt';col='var(--energy)'}else{lab='Ta det rolig i dag';col='var(--warn)'}}
 return{score,lab,col,parts,note,date:l.d||h.d||rp.d};
}
function ring(score,col){const r=44,c=2*Math.PI*r,off=c*(1-(score||0)/100);return `<svg viewBox="0 0 104 104" style="width:104px;height:104px"><circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--card2)" stroke-width="9"/><circle cx="52" cy="52" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 52 52)"/></svg>`}

/* ---------- energy balance ---------- */
function energyBalance(day){const r=byDate[day];if(!r)return null;const inn=r.kcm;const ut=(r.fb!=null)?r.fb:(r.ae!=null?Math.round(r.ae+2300):null);/* Garmin målt total, ellers aktiv+basal~2300 */return{inn,ut,bal:(inn!=null&&ut!=null)?Math.round(inn-ut):null}}

/* ---------- Garmin recovery-panel (datasanker, kondisjons-fokus) ---------- */
function garminPanel(r){
 if(r==null||(r.tr==null&&r.bb==null&&r.str==null))return '';
 const TRL={VERY_LOW:'svært lav',LOW:'lav',MODERATE:'moderat',HIGH:'høy',VERY_HIGH:'svært høy'};
 const TRT={FIND_TIME_TO_RELAX:'Finn tid til å slappe av',SLEEP_MORE:'Sov mer',HIGH_STRESS:'Høyt stress – ta det rolig',READY_TO_TRAIN:'Klar for trening',GOOD_TIME_TO_TRAIN:'God tid å trene',PRIME_TIME_TO_TRAIN:'Toppform for trening',PUSH_YOURSELF:'Du kan pushe',MAINTAIN_MOMENTUM:'Hold momentum',MODERATE:'Moderat dag',LOW_RT:'Kort restitusjon',NONE:''};
 const bc=v=>v==null?'var(--mut)':v>=70?'var(--good)':v>=40?'var(--energy)':'var(--warn)';
 const tc=v=>v==null?'var(--mut)':v>=70?'var(--good)':v>=50?'var(--energy)':'var(--warn)';
 let boxes='';
 boxes+=`<div class="stat"><div class="k">Treningsberedskap</div><div class="v" style="color:${tc(r.tr)}">${r.tr!=null?r.tr:'–'}<small>${r.trl?' '+(TRL[r.trl]||r.trl.toLowerCase()):''}</small></div></div>`;
 boxes+=`<div class="stat"><div class="k">Body Battery</div><div class="v" style="color:${bc(r.bb)}">${r.bb!=null?r.bb:'–'}<small>/100</small></div></div>`;
 boxes+=`<div class="stat"><div class="k">Stress snitt</div><div class="v">${r.str!=null?Math.round(r.str):'–'}</div></div>`;
 const rec=r.trtxt?(TRT[r.trtxt]!=null?TRT[r.trtxt]:r.trtxt.replace(/_/g,' ').toLowerCase()):'';
 return `<h2 class="sh">Garmin recovery <span class="mi" onclick="tgl('gminfo')">i</span></h2>`
  +`<div id="gminfo" class="muted small" style="display:none;margin:0 6px 6px">Garmin er en <b>datasanker</b> med kondisjons-fokus. Tallene måler restitusjon godt, men Garmin kjenner ikke styrkeplanen din — <b>planen bestemmer</b> (se «Trening i dag»). Symptomer slår app-tall.</div>`
  +`<div class="card"><div class="grid g3">${boxes}</div>`
  +(rec?`<div class="rb" style="margin-top:10px"><b>Garmins anbefaling:</b> ${rec}. <span class="muted">Gjelder kondisjon — ikke en overstyring av styrkedagen.</span></div>`:'')
  +`</div>`;
}

/* ================= PAGE: I DAG ================= */
function pageIdag(){
 const rd=readiness();const day=rd.date||maxD;const r=byDate[day]||{};
 let h='';
 h+=`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div class="pagetitle">I dag</div><div class="pagesub">${DAG[toDate(day).getDay()]} ${labelDay(day)} · dagsform basert på natt</div></div><button onclick="oppdaterOgSynk()" style="flex-shrink:0;margin-top:4px;background:var(--card2);color:var(--acc);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;white-space:nowrap">↻ Oppdater</button></div>`;
 h+=`<div class="card hero"><div class="ring">${ring(rd.score,rd.col)}<div class="val"><div><div class="num" style="color:${rd.col}">${rd.score!=null?rd.score:'–'}</div><div class="lab">dagsform</div></div></div></div><div class="txt"><div class="st" style="color:${rd.col}">${rd.lab}</div><div class="ds">${rd.parts.map(p=>p[0]+' '+p[1]).join(' · ')}</div>${rd.note?'<div class="muted small" style="margin-top:5px">'+rd.note+'</div>':''}</div></div>`;
 // Garmin recovery (datasanker)
 h+=garminPanel(r);
 // vital summary
 h+='<h2 class="sh">Nøkkeltall</h2><div class="grid">';
 [['w','Vekt'],['rhr','Hvilepuls'],['hrv','HRV natt'],['sl','Søvn'],['st','Skritt'],['ae','Aktiv energi']].forEach(([k,t])=>{
  const lv=lastVal(k,false),m=MK[k];const s7=windowMean(k,7),s14=windowMean(k,14,addDays(maxD,-7));
  h+=`<div class="stat" onclick="go('data','${k}')"><div class="k">${t}</div><div class="v">${fmt(lv.v,m.d)}<small>${m.u}</small></div>${chipHtml(s7,s14,m.hb)}</div>`});
 h+='</div>';
 // sleep
 if(r.sl!=null){const light=Math.max(0,(r.sl||0)-(r.dp||0)-(r.rm||0)),tot=(r.sl||0)+(r.aw||0)||1;const seg=(v,c)=>`<div style="width:${(v/tot*100).toFixed(1)}%;background:${c}"></div>`;
  h+=`<h2 class="sh">Søvn i natt</h2><div class="card"><div style="font-size:19px;font-weight:800">${fmt(r.sl,1)} t</div><div class="stage">${seg(r.dp,'#3b5bdb')}${seg(r.rm,'#7c5cff')}${seg(light,'#4dabf7')}${seg(r.aw,'#3a4657')}</div><div class="legend"><span><i class="d" style="background:#3b5bdb"></i>Dyp ${fmt(r.dp,1)}</span><span><i class="d" style="background:#7c5cff"></i>REM ${fmt(r.rm,1)}</span><span><i class="d" style="background:#4dabf7"></i>Lett ${fmt(light,1)}</span><span><i class="d" style="background:#3a4657"></i>Våken ${fmt(r.aw,1)}</span></div></div>`}
 // today training planned vs done
 h+='<h2 class="sh">Trening i dag</h2>'+todayTraining(day);
 // energy balance
 const eb=energyBalance(day);
 if(eb&&eb.bal!=null){h+=`<h2 class="sh">Energibalanse i dag</h2><div class="card"><div style="display:flex;justify-content:space-between"><div><div class="muted small">Inntak</div><div style="font-weight:800;font-size:18px">${fmt(eb.inn,0)}</div></div><div><div class="muted small">Forbruk</div><div style="font-weight:800;font-size:18px">${fmt(eb.ut,0)}</div></div><div><div class="muted small">Balanse</div><div style="font-weight:800;font-size:18px;color:${eb.bal<0?'var(--good)':'var(--energy)'}">${eb.bal>0?'+':''}${fmt(eb.bal,0)}</div></div></div><div class="muted small" style="margin-top:8px">Kun logget mat teller. Forbruk = Garmin målt total (BMR+aktiv), ellers aktiv + basal ~2300.</div></div>`}
 // recommendation
 if(REC){h+=`<h2 class="sh">Anbefaling i morgen</h2><div class="card rec"><div class="rk">🏋️ ${REC.tren_t}</div><div class="rb">${REC.tren_b}</div><div class="rk" style="margin-top:10px">🍽️ ${REC.mat_t}</div><div class="rb">${REC.mat_b}</div><div class="muted small" style="margin-top:9px;border-top:1px solid var(--line);padding-top:7px">Forslag ut fra dine mål og recovery — ikke medisinsk råd. Forutsetter legeklarering.</div></div>`}
 document.getElementById('p-idag').innerHTML=h;

function plannedFor(day){const wd=(toDate(day).getDay()+6)%7;return PLANMAL[String(wd)]||null}
function doneFor(day){const w=WK.filter(x=>x.d===day);const sty=(STY[day]||[]).length>0;let type=null;if(sty)type='styrke';else if(w.length){const t=w.map(x=>x.t).join(' ');type=/Styrke/.test(t)?'styrke':'kondis'}return{workouts:w,sty,type}}
function todayTraining(day){
 const dn=doneFor(day);let h='<div class="card">';
 if(dn.workouts.length||dn.sty){
  dn.workouts.forEach((x,i)=>{h+=`<div class="li tap" onclick="tglKart('td${i}')"><div><div class="nm">✓ ${x.t} <span class="muted">▾</span></div><div class="dt">${x.km?fmt(x.km,1)+' km · ':''}${x.hr?'snittpuls '+x.hr:''}</div></div><div class="rt"><div class="b">${fmt(x.m,0)} min</div><div class="dt">${x.kc?x.kc+' kcal':''}</div></div></div><div id="td${i}" style="display:none">${woDetail(x)}</div>`});
  if(dn.sty){h+=`<div class="li"><div class="nm">✓ Styrke loggført (${(STY[day]||[]).length} øvelser)</div><span class="pill ok">gjort</span></div>`;(STY[day]||[]).forEach(e=>{h+=`<div class="ex"><b>${e.o}</b> <span class="muted">${e.s}×${e.r}${e.v?' · '+e.v+' kg':' · RIR '+e.rir}</span></div>`})}
}else{const plan=PLAN.find(p=>p.dato===day);if(plan){h+=`<div class="li"><div><div class="nm">Plan: ${plan.tittel}</div><div class="dt">${plan.fokus}</div></div><span class="pill ${plan.type==='styrke'?'styrke':'ok'}">plan</span></div>`}else if(FASE){const n=FASE.rotasjon[nextStrengthIdx()];h+=`<div class="li"><div><div class="nm">Neste økt: ${n.tittel}</div><div class="dt">styrke · eller restitusjon Zone 2</div></div><span class="pill styrke">forslag</span></div>`}h+=`<div class="muted small center" style="padding:12px">Ingen økt registrert ennå i dag.</div>`}
 h+='</div>';return h;
}

/* ================= PAGE: TRENING ================= */
function pageTrening(){
 let h='<div class="pagetitle">Trening</div>';
 h+=`<div class="seg2" style="margin:2px 4px 12px"><button class="${trTab==='plan'?'on':''}" style="flex:1" onclick="trTab='plan';pageTrening()">Plan</button><button class="${trTab==='trening'?'on':''}" style="flex:1" onclick="trTab='trening';pageTrening()">Trening</button></div>`;
 h+=(trTab==='trening')?treningLogg():planVisning();
 document.getElementById('p-trening').innerHTML=h;window.scrollTo(0,0);
}
function strengthDays(){const s=new Set();Object.keys(STY).forEach(d=>{if(!FASE||d>=FASE.start)s.add(d)});WK.forEach(w=>{if(/Styrke/i.test(w.t)&&(w.m||0)>=20&&(!FASE||w.d>=FASE.start))s.add(w.d)});return [...s].sort();}
function faseUke(){if(!FASE)return 1;const dgr=Math.floor((toDate(maxD)-toDate(FASE.start))/86400000);return Math.min(FASE.uker,Math.max(1,Math.floor(dgr/7)+1));}
function nextStrengthIdx(){if(!FASE)return 0;return strengthDays().length%FASE.rotasjon.length;}
function sisteFor(o){const ds=Object.keys(STY).sort().reverse();for(const d of ds){const e=(STY[d]||[]).find(x=>x.o===o);if(e)return {v:+e.v||0,s:e.s,r:e.r,d};}return null;}
async function saveStyrke(tittel,n){
 const st=document.getElementById('lagrestatus');
 const ov=FASE.rotasjon[nextStrengthIdx()].ov;const rader=[];
 for(let i=0;i<n;i++){const kg=(document.getElementById('lkg'+i)||{}).value;const rp=(document.getElementById('lrp'+i)||{}).value;
  if(kg&&(''+kg).trim()!==''){rader.push({ovelse:ov[i],vekt_kg:(''+kg).trim(),reps:(rp&&(''+rp).trim())||'12',sett:3,rir:FASE.rir,notat:tittel});}}
 if(!rader.length){st.innerHTML='<span style="color:var(--energy)">Skriv inn minst én vekt først.</span>';return;}
 if(typeof sb==='undefined'||!sb){st.innerHTML='<span style="color:var(--warn)">Ikke innlogget.</span>';return;}
 st.textContent='Lagrer…';
 const dato=fromDate(new Date());
 const {data,error}=await sb.rpc('helse_lagre_styrke',{p_dato:dato,p_rader:rader});
 if(error){st.innerHTML='<span style="color:var(--warn)">Feil: '+error.message+'</span>';return;}
 st.innerHTML='<span style="color:var(--good)">✓ Lagret '+rader.length+' øvelser ('+dato+'). Vises i «Trening»-loggen etter neste synk.</span>';
}
function planVisning(){
 if(!FASE)return '<div class="muted small">Ingen plan.</div>';
 const uke=faseUke(),idx=nextStrengthIdx(),neste=FASE.rotasjon[idx],gjort=strengthDays().length;
 let h=`<div class="card" style="background:var(--grad);color:#fff;border:0"><div style="font-weight:850;font-size:18px">${FASE.navn}</div><div style="opacity:.92;font-size:13px;margin-top:2px">Uke ${uke} av ${FASE.uker} · ${gjort} styrkeøkter gjennomført</div></div>`;
 h+='<h2 class="sh">Mål i fasen</h2><div class="card"><div class="muted small" style="margin-bottom:8px">Bygg sener, senefester og teknikk før vi legger på vekt. Tre brytere fra din egen langtidsanalyse:</div>'+FASE.brytere.map(b=>`<div class="ex">🎯 ${b}</div>`).join('')+`<div class="muted small" style="margin-top:8px">Alle øvelser: <b style="color:var(--ink)">${FASE.reps} reps · RIR ${FASE.rir} · ${FASE.tempo}</b>. Aldri til failure.</div></div>`;

function monthVolume(){const m={};WK.forEach(x=>{const k=x.d.slice(0,7);m[k]=(m[k]||0)+1});const labels=Object.keys(m).sort().slice(-14);return{labels,counts:labels.map(l=>m[l])}}
function barChart(labels,counts){if(!counts.length)return '<div class="muted small">ingen data</div>';const W=320,H=120,pl=6,pb=16,pt=8;const mx=Math.max(1,...counts),n=counts.length,bw=(W-2*pl)/n*.72;const X=i=>pl+(i+.5)*((W-2*pl)/n),Y=v=>pt+(1-v/mx)*(H-pt-pb);let s='';counts.forEach((v,i)=>{const hh=(H-pt-pb)-(Y(v)-pt);s+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="url(#g)"><title>${labels[i]}: ${v}</title></rect>`});return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="height:${H}px"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>${s}<text x="${pl}" y="${H-3}" fill="var(--dim)" font-size="9">${labels[0]}</text><text x="${W-pl}" y="${H-3}" fill="var(--dim)" font-size="9" text-anchor="end">${labels[n-1]}</text></svg>`}

 else if(g==='aar'){const y=a.slice(0,4);const grp={};R.forEach(r=>{if(r.d.slice(0,4)!==y||r[k]==null)return;(grp[r.d.slice(0,7)]=grp[r.d.slice(0,7)]||[]).push(r[k])});series=Object.keys(grp).sort().map(key=>[MON[+key.slice(5,7)-1],av(grp[key])]);label=y;}

function analysisCard(k,arr){

 };

function pageKropp(){
 let h='<div class="pagetitle">Kropp & hjerte</div><div class="pagesub">Langtid · 12 års historikk</div>';
 const cards=[['w','Vekt',false],['bps','Blodtrykk systolisk',false],['rhr','Hvilepuls',false],['hrv','HRV natt',true],['vo2','VO₂max',true],['o2','SpO₂',true]];
 // BP special: latest sys/dia
 const bl=lastVal('bps',false),dl=lastVal('bpd',false);
 h+=`<div class="grid g3"><div class="stat" onclick="go('data','w')"><div class="k">Vekt nå</div><div class="v">${fmt(lastVal('w',false).v,1)}</div></div><div class="stat" onclick="go('data','bps')"><div class="k">Blodtrykk</div><div class="v" style="font-size:18px">${bl.v?Math.round(bl.v)+'/'+Math.round(dl.v||0):'–'}</div></div><div class="stat" onclick="go('data','vo2')"><div class="k">VO₂max</div><div class="v">${fmt(lastVal('vo2',false).v,1)}</div></div></div>`;
 cards.forEach(([k,t,hb])=>{const s=longSeries(k);if(!s.filter(p=>p[1]!=null).length)return;const st=stat(s.map(p=>p[1]).filter(x=>x!=null));h+=`<h2 class="sh">${t}</h2><div class="card"><div class="muted small">${st?fmt(st.min,MK[k].d)+'–'+fmt(st.max,MK[k].d)+' '+MK[k].u+' · snitt '+fmt(st.mean,MK[k].d):''}</div><div class="tap" onclick="openFull(longSeries('${k}'),'${t}',MK['${k}'].u,${hb})">${lineChart(s,hb,130)}</div><div class="taphint">👆 Trykk for fullskjerm (per år)</div></div>`});
 document.getElementById('p-kropp').innerHTML=h;
}

/* ================= PAGE: KOSTHOLD ================= */
function pageKost(){
 let h='<div class="pagetitle">Kosthold</div><div class="pagesub">Mål: ~'+MAAL.kcal+' kcal · '+MAAL.protein+' g protein</div>';
 let fday=null;for(let i=R.length-1;i>=0;i--){if(FOOD[R[i].d]){fday=R[i].d;break}}
 if(fday){const items=FOOD[fday];
  const tk=items.reduce((a,b)=>a+(+b.k||0),0),tp=items.reduce((a,b)=>a+(+b.p||0),0),tc=items.reduce((a,b)=>a+(+b.c||0),0),tf=items.reduce((a,b)=>a+(+b.f||0),0),tfib=items.reduce((a,b)=>a+(+b.fi||0),0);
  const rest=Math.max(0,MAAL.protein-tp);
  h+=`<h2 class="sh">Proteinmål · ${labelDay(fday)}</h2><div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-size:30px;font-weight:850">${fmt(tp,0)}<small class="muted" style="font-size:15px"> / ${MAAL.protein} g</small></div><div style="font-size:19px;font-weight:800;color:${rest>0?'var(--energy)':'var(--good)'}">${rest>0?fmt(rest,0)+' g igjen':'✓ nådd'}</div></div>${bar(tp,MAAL.protein)}<div class="muted small" style="margin-top:7px">Protein bevarer muskel når du går ned i vekt. 1 g protein = 4 kcal.</div></div>`;
  const pct=(g,m)=>tk>0?Math.round(g*m/tk*100):0;
  const rowMac=(n,g,mal,m)=>`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span><b>${n}</b> ${fmt(g,0)} g <span class="muted">(${pct(g,m)}%)</span></span><span class="muted">mål ${mal} g</span></div>${bar(g,mal)}</div>`;
  const rowFib=`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span><b>Fiber</b> ${fmt(tfib,0)} g</span><span class="muted">mål ~30 g</span></div>${bar(tfib,30)}</div>`;
  h+='<h2 class="sh">Fordeling i dag vs. mål</h2><div class="card">'+rowMac('Protein',tp,MAAL.protein,4)+rowMac('Karbo',tc,MAAL.karbo,4)+rowMac('Fett',tf,MAAL.fett,9)+rowFib+`<div class="muted small" style="margin-top:6px">Kalorier ${fmt(tk,0)} / ${MAAL.kcal}. Målfordeling ≈ 34% protein · 36% karbo · 30% fett. Fiber ~30–35 g anbefalt.</div></div>`;
  h+='<h2 class="sh">Det du spiste</h2><div class="card">'+items.map(f=>`<div class="li"><div class="nm" style="font-weight:550">${f.n}</div><div class="rt"><div class="b">${Math.round(f.k||0)} kcal</div><div class="dt">${fmt(f.p,1)} g protein</div></div></div>`).join('')+'</div>';
 }else h+='<div class="card muted small center" style="padding:20px">Ingen kosthold logget ennå. Fortell Claude hva du spiser, så føres det inn.</div>';
 h+='<h2 class="sh">Slik bør kosten se ut</h2><div class="card"><div class="ex"><b>Protein hvert måltid</b> — 30–40 g × 4–5 = 150–180 g.</div><div class="ex"><b>Grønt rikelig</b> · <b>karbo rundt trening</b> · <b>mindre søtt sent</b> (beskytter dyp søvn).</div><button class="lagrebtn" style="background:var(--card2);color:var(--acc);border:1px solid var(--line);margin-top:11px" onclick="visTips()">💡 Åpne proteinguide — kilder, fordeling, kcal/gram</button></div>';
 const ps=R.filter(r=>r.prm!=null).map(r=>[r.d.slice(5),r.prm]);
 if(ps.length>1){h+='<h2 class="sh">Protein-trend (loggførte dager)</h2><div class="card">'+lineChart(ps,true,110)+'<div class="muted small" style="margin-top:6px">Mål-linje: '+MAAL.protein+' g. Protein bevarer muskel når du går ned i vekt.</div></div>'}
 document.getElementById('p-kost').innerHTML=h;
}
function bar(v,max){const p=Math.min(100,v/max*100);const c=p>=90?'var(--good)':p>=60?'var(--energy)':'var(--warn)';return `<div style="height:5px;background:var(--card2);border-radius:3px;margin-top:7px;overflow:hidden"><div style="width:${p}%;height:100%;background:${c}"></div></div>`}

/* ================= FULLSKJERM-GRAF med markør ================= */
let apx=null;
function openFull(series,title,unit,hb){
 if(!series||series.length<2||typeof ApexCharts==='undefined')return;
 const el=document.getElementById('cmodal');el.className='cmodal on';
 el.innerHTML=`<div class="chead"><div class="ctitle">${title}</div><button class="cclose" onclick="closeFull()">✕</button></div><div class="cwrap" id="cwrap" style="padding:4px"></div><div class="chelp">Dra fingeren for verdi · knip for å zoome · dobbelttrykk nullstiller</div>`;
 const data=series.map(p=>({x:p[0],y:(p[1]==null?null:Math.round(p[1]*100)/100)}));
 const col=(hb===false)?'#ff9f43':'#5b8cff', u=unit||'';
 apx=new ApexCharts(document.getElementById('cwrap'),{
  chart:{type:'area',height:'100%',background:'transparent',foreColor:'#8b98ad',toolbar:{show:false},zoom:{enabled:true,type:'x',autoScaleYaxis:true},animations:{enabled:false},fontFamily:'-apple-system,sans-serif'},
  theme:{mode:'dark'},
  series:[{name:title,data}],
  colors:[col],
  stroke:{width:2.5,curve:'straight'},
  fill:{type:'gradient',gradient:{shadeIntensity:1,opacityFrom:.4,opacityTo:0,stops:[0,100]}},
  dataLabels:{enabled:false},markers:{size:0,hover:{size:6}},
  grid:{borderColor:'#26303f',strokeDashArray:3,padding:{left:8,right:8}},
  xaxis:{type:'category',tickAmount:6,tickPlacement:'on',labels:{rotate:0,hideOverlappingLabels:true,style:{fontSize:'10px'}},axisTicks:{show:false},axisBorder:{show:false},crosshairs:{show:true,stroke:{color:col,width:1,dashArray:4}},tooltip:{enabled:false}},
  yaxis:{tickAmount:5,labels:{formatter:v=>(Math.round(v*10)/10).toLocaleString('no'),style:{fontSize:'10px'}}},
  tooltip:{theme:'dark',x:{show:true},y:{formatter:v=>fmt(v,1)+' '+u,title:{formatter:()=>title+': '}},marker:{show:true}},
 });
 apx.render();
}
function closeFull(){if(apx){try{apx.destroy()}catch(e){}apx=null}const el=document.getElementById('cmodal');el.className='cmodal';el.innerHTML=''}
function visTips(){const el=document.getElementById('cmodal');el.className='cmodal on';
 const kilder=[['Myseisolat, 1 scoop',27,110],['Tunfisk i vann, 1 boks',26,110],['Reker 150 g',33,150],['Torsk 150 g',27,120],['Eggehvite × 3',11,51],['Kalkunfilet 150 g',35,160],['Kyllingfilet 150 g',33,165],['Skyr 150 g',17,90],['Kesam mager 150 g',17,100],['Cottage cheese 150 g',18,145],['Laks 150 g',30,300]].map(r=>[r[0],r[1],r[2],Math.round(r[1]/r[2]*100)]).sort((a,b)=>b[3]-a[3]);
 const rad=(a,b)=>`<div class="li"><span>${a}</span><b style="white-space:nowrap">${b}</b></div>`;
 el.innerHTML=`<div class="chead"><div class="ctitle">💡 Proteinguide</div><button class="cclose" onclick="closeFull()">✕</button></div>
 <div style="overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px">
  <div class="card"><div class="rk" style="font-weight:800;margin-bottom:6px">Kalorier per gram</div>${rad('Protein','4 kcal/g')}${rad('Karbo','4 kcal/g')}${rad('Fett','9 kcal/g (dobbelt så tungt)')}${rad('Alkohol','7 kcal/g')}</div>
  <div class="card"><div class="rk" style="font-weight:800;margin-bottom:6px">Slik bør en dag se ut (~${MAAL.kcal} kcal)</div>${rad('Protein','165 g · 34%')}${rad('Karbo','175 g · 36%')}${rad('Fett','65 g · 30%')}<div class="muted small" style="margin-top:6px">Fett er «tungt» (9 kcal/g) — fløtesaus/ost/dessert spiser budsjettet fort.</div></div>
  <div class="card"><div class="rk" style="font-weight:800;margin-bottom:4px">Beste proteinkilder — rangert per kalori</div><div class="li" style="font-size:11px;color:var(--mut);padding:5px 0"><span style="flex:1">Matvare</span><span style="width:44px;text-align:right">prot.</span><span style="width:38px;text-align:right">kcal</span><span style="width:66px;text-align:right">pr 100 kcal</span></div>${kilder.map(r=>`<div class="li"><span style="flex:1;font-weight:550">${r[0]}</span><span style="width:44px;text-align:right">${r[1]} g</span><span style="width:38px;text-align:right;color:var(--mut)">${r[2]}</span><span style="width:66px;text-align:right;font-weight:800;color:var(--acc)">${r[3]} g</span></div>`).join('')}<div class="muted small" style="margin-top:6px"><b>Pr 100 kcal</b> teller når du slanker — magert vinner. Ost/spekemat ser proteinrikt ut, men er tungt på kalorier.</div></div>
  <div class="card"><div class="rk" style="font-weight:800;margin-bottom:6px">Tett gapet enkelt</div><div class="muted small">Mangler du ~77 g: <b style="color:var(--ink)">skyr (17) + kyllingporsjon (33) + 1 scoop myse (24) ≈ 74 g</b> oppå det du alt spiser — da når du mål uten å sprenge kaloriene.</div></div>
  <div class="muted small center" style="padding:6px 10px 16px">Veiledende — ikke medisinsk råd.</div>
 </div>`;}

/* ================= ROUTER ================= */
const PAGES={idag:pageIdag,trening:pageTrening,data:pageData,kropp:pageKropp,kost:pageKost};
function show(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));document.getElementById('p-'+p).classList.add('on');document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));try{PAGES[p]()}catch(e){document.getElementById('p-'+p).innerHTML='<div class="card warn">Feil: '+e.message+'</div>'}window.scrollTo(0,0)}
function go(p,metric){if(metric){dMetric=metric}show(p)}
document.querySelectorAll('#nav a').forEach(a=>a.addEventListener('click',()=>show(a.dataset.p)));
function boot(data){
 DATA=data;R=DATA.daily||[];WK=DATA.workouts||[];FOOD=DATA.food||{};STY=DATA.styrke||{};
 PLAN=DATA.ukeplan||[];PLANMAL=DATA.planmal||{};FASE=DATA.fase||null;REC=DATA.anbefaling;MAAL=DATA.maal||MAAL;
 byDate=Object.fromEntries(R.map(r=>[r.d,r]));minD=R[0].d;maxD=R[R.length-1].d;
 document.getElementById('hsub').textContent=`${DATA.meta.days} dager · ${DATA.meta.workouts} økter · oppdatert ${DATA.meta.updated}`;
 document.getElementById('shell').style.display='none';document.getElementById('nav').style.display='flex';
 show('idag');
}
async function gunzipB64(b64){const bin=atob(b64),by=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);const st=new Blob([by]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(st).text());}
let _synkPoll=null;
function toast(msg){let t=document.getElementById('htoast');if(!t){t=document.createElement('div');t.id='htoast';t.style.cssText='position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:88%;text-align:center;transition:opacity .4s';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(t._to);t._to=setTimeout(()=>{t.style.opacity='0';},4500);}
async function oppdaterOgSynk(){
 let f=(DATA.meta&&DATA.meta.updated)||'';
 toast('🔄 Henter ferske tall …');
 try{const {data}=await sb.rpc('helse_snapshot');if(data){const nd=await gunzipB64(data);boot(nd);f=(nd.meta&&nd.meta.updated)||f;}}catch(e){}
 try{await sb.rpc('helse_be_om_synk');}catch(e){toast('✓ Viser nyeste (kunne ikke bestille ny synk)');return;}
 toast('🔄 Ber Mac-en om nyeste … (~1 min)');
 if(_synkPoll)clearInterval(_synkPoll);let n=0;
 _synkPoll=setInterval(async()=>{n++;
  try{const {data}=await sb.rpc('helse_snapshot');if(data){const nd=await gunzipB64(data);if(nd.meta&&nd.meta.updated!==f){clearInterval(_synkPoll);_synkPoll=null;boot(nd);toast('✓ Oppdatert — '+nd.meta.updated);return;}}}catch(e){}
  if(n>=12){clearInterval(_synkPoll);_synkPoll=null;toast('Viser det som var klart. Trykk igjen om et halvt minutt om noe mangler.');}
 },12000);
}
function shellMsg(html){const s=document.getElementById('shell');s.innerHTML=html;s.style.display='flex';document.getElementById('nav').style.display='none';}
async function loadData(){
 shellMsg('<div class="lbox"><div class="spin"></div><div class="muted">Henter helsedata…</div></div>');
 const {data,error}=await sb.rpc('helse_snapshot');
 if(error||!data){showLogin('Kunne ikke hente data'+(error?': '+error.message:'.'));return;}
 try{boot(await gunzipB64(data));}catch(e){shellMsg('<div class="lbox"><div class="muted">Feil ved lasting: '+e.message+'</div></div>');}
}
function showLogin(msg){
 shellMsg(`<div class="login"><div class="mono2">TH</div><h1>Terje · Helse</h1><p class="muted small">Logg inn for å se dataene</p>${msg?'<div class="lerr">'+msg+'</div>':''}<input id="lem" type="email" placeholder="E-post" value="terje@hystad.me" autocapitalize="off" autocomplete="username"><input id="lpw" type="password" placeholder="Passord" autocomplete="current-password"><label class="showpw"><input type="checkbox" onchange="document.getElementById('lpw').type=this.checked?'text':'password'"> Vis passord</label><button id="lbtn" onclick="doLogin()">Logg inn</button></div>`);
}
async function doLogin(){
 const em=document.getElementById('lem').value.trim(),pw=document.getElementById('lpw').value;
 const b=document.getElementById('lbtn');if(b){b.textContent='…';b.disabled=true;}
 const r=await sb.auth.signInWithPassword({email:em,password:pw});
 if(r.error){showLogin(/invalid/i.test(r.error.message||'')?'Feil e-post eller passord. Prøv igjen.':r.error.message);return;}
 loadData();
}
async function initApp(){
 if(!window.supabase){shellMsg('<div class="lbox"><div class="muted">Innlogging utilgjengelig.</div></div>');return;}
 sb=window.supabase.createClient(SBURL,SBKEY);
 const {data:{session}}=await sb.auth.getSession();
 if(session)loadData();else showLogin('');
}
initApp();
</script></body></html>
