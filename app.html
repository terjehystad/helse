/* ---------- charts ---------- */
function lineChart(points,hb,h){
 h=h||120;const W=320,pl=34,pr=8,pt=10,pb=18;

 if(ys.length<2)return '<div class="muted small center" style="padding:20px">for lite data</div>';

 points.forEach((p,i)=>{if(p[1]==null)return;d+=(started?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)+' ';started=true;if(firstI==null)firstI=i;lastI=i});
 const first=points[firstI][1],last=points[lastI][1];const up=last>first,col=(up===hb)?'var(--good)':'var(--warn)';

}

function woDetail(x){const rows=[['Distanse',x.km?fmt(x.km,2)+' km':0],['Snittpuls',x.hr?x.hr+' /min':0],['Makspuls',x.hrmax?x.hrmax+' /min':0],['Snittfart',x.spd?fmt(x.spd,1)+' km/t':0],['Energi',x.kc?x.kc+' kcal':0],['Skritt',x.steps?fmt(x.steps,0):0],['Kadens',x.cad?x.cad+' spm':0],['Høyde ↑',x.up?x.up+' m':0],['Trapper',x.fl||0],['Tid',x.s&&x.e?x.s+'–'+x.e:0]].filter(r=>r[1]);const kv=rows.map(r=>`<div class="kv" style="display:flex;justify-content:space-between;font-size:12.5px;background:var(--card2);border-radius:9px;padding:6px 10px"><span class="muted">${r[0]}</span><b>${r[1]}</b></div>`).join('');return `<div style="padding:8px 0">${hrCurve(x.hrs)}${routeSvg(x.rt)}${elevSvg(x.alt)}<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">${kv}</div></div>`}

/* ---------- readiness ---------- */
function readiness(){
 const l=lastVal('sl',false),h=lastVal('hrv',false),rp=lastVal('rhr',false);
 const hb=windowMean('hrv',30),rb=windowMean('rhr',30);
 let sc=[],parts=[];
 if(l.v!=null){const s=Math.max(0,Math.min(1,(l.v-4)/(7.5-4)));sc.push(s);parts.push(['Søvn',fmt(l.v,1)+' t'])}
 if(h.v!=null&&hb){const s=Math.max(0,Math.min(1,h.v/(hb*1.15)));sc.push(s);parts.push(['HRV',Math.round(h.v)+' ms'])}
 if(rp.v!=null&&rb){const s=Math.max(0,Math.min(1,rb/rp.v));sc.push(s);parts.push(['Hvilepuls',Math.round(rp.v)])}
 const score=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length*100):null;
 let lab='—',col='var(--mut)';
 if(score!=null){if(score>=70){lab='Klar for økt';col='var(--good)'}else if(score>=50){lab='Moderat — hold igjen litt';col='var(--energy)'}else{lab='Ta det rolig i dag';col='var(--warn)'}}
 return{score,lab,col,parts,date:l.d||h.d||rp.d};
}
function ring(score,col){const r=44,c=2*Math.PI*r,off=c*(1-(score||0)/100);return `<svg viewBox="0 0 104 104" style="width:104px;height:104px"><circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--card2)" stroke-width="9"/><circle cx="52" cy="52" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 52 52)"/></svg>`}

function plannedFor(day){const wd=(toDate(day).getDay()+6)%7;return PLANMAL[String(wd)]||null}

  const c=rest?'var(--dim)':(d?'var(--good)':'var(--warn)');cells.push(`<div title="${day}" style="flex:1;height:26px;border-radius:5px;background:${c};opacity:${rest?.3:.9}"></div>`)}

function monthVolume(){const m={};WK.forEach(x=>{const k=x.d.slice(0,7);m[k]=(m[k]||0)+1});const labels=Object.keys(m).sort().slice(-14);return{labels,counts:labels.map(l=>m[l])}}
function barChart(labels,counts){if(!counts.length)return '<div class="muted small">ingen data</div>';const W=320,H=120,pl=6,pb=16,pt=8;const mx=Math.max(1,...counts),n=counts.length,bw=(W-2*pl)/n*.72;const X=i=>pl+(i+.5)*((W-2*pl)/n),Y=v=>pt+(1-v/mx)*(H-pt-pb);let s='';counts.forEach((v,i)=>{const hh=(H-pt-pb)-(Y(v)-pt);s+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="url(#g)"><title>${labels[i]}: ${v}</title></rect>`});return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="height:${H}px"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>${s}<text x="${pl}" y="${H-3}" fill="var(--dim)" font-size="9">${labels[0]}</text><text x="${W-pl}" y="${H-3}" fill="var(--dim)" font-size="9" text-anchor="end">${labels[n-1]}</text></svg>`}

let dMetric='w', dGran='uke', dAnchor=maxD;
function clampD(s){return s<minD?minD:(s>maxD?maxD:s)}
function clampYear(y){const lo=+minD.slice(0,4),hi=+maxD.slice(0,4);return (y<lo?lo:(y>hi?hi:y))+'-06-15'}
function longSeries(k){const grp={};R.forEach(r=>{if(r[k]==null)return;(grp[r.d.slice(0,4)]=grp[r.d.slice(0,4)]||[]).push(r[k])});const av=a=>MK[k].agg==='last'?a[a.length-1]:a.reduce((x,y)=>x+y,0)/a.length;return Object.keys(grp).sort().map(y=>[y,av(grp[y])])}

 if(g==='dag'){const days=[...Array(7)].map((_,i)=>addDays(a,i-6));series=days.map(d=>[d.slice(8), (byDate[d]&&byDate[d][k]!=null)?byDate[d][k]:null]);label=toDate(a).getDate()+'. '+MONF[toDate(a).getMonth()].toLowerCase()+' '+a.slice(0,4);}
 else if(g==='uke'){const m=monday(a);const DD=['ma','ti','on','to','fr','lø','sø'];const days=[...Array(7)].map((_,i)=>addDays(m,i));series=days.map((d,i)=>[DD[i], (byDate[d]&&byDate[d][k]!=null)?byDate[d][k]:null]);label='Uke '+isoWeek(m)+' · '+m.slice(0,4);}
 else if(g==='mnd'){const ym=a.slice(0,7);const rs=R.filter(r=>r.d.slice(0,7)===ym&&r[k]!=null);series=rs.map(r=>[r.d.slice(8),r[k]]);label=MONF[+ym.slice(5,7)-1]+' '+ym.slice(0,4);}
 else if(g==='aar'){const y=a.slice(0,4);const grp={};R.forEach(r=>{if(r.d.slice(0,4)!==y||r[k]==null)return;(grp[r.d.slice(0,7)]=grp[r.d.slice(0,7)]||[]).push(r[k])});series=Object.keys(grp).sort().map(key=>[MON[+key.slice(5,7)-1],av(grp[key])]);label=y;}
 else {const grp={};R.forEach(r=>{if(r[k]==null)return;(grp[r.d.slice(0,7)]=grp[r.d.slice(0,7)]||[]).push(r[k])});series=Object.keys(grp).sort().map(key=>[key.slice(2),av(grp[key])]);label='Hele perioden';}
 return {series,label};
}
function navP(dir){

 else h+=`<div class="muted small center" style="padding:14px">${arr.length===1?'Én måling i perioden.':'Ingen data i denne perioden.'}</div>`;

function analysisCard(k,arr){
 const st=stat(arr);if(!st)return '';const m=MK[k];const rules={
  w:s=>['Følg ukesnittet, ikke enkeltdager (væske svinger). Mål ~90 kg — definisjon, ikke størrelse.'],
  rhr:s=>[s.mean<60?'Lavt/atletisk-nært — godt tegn.':s.mean<=75?'Innenfor normalt (60–100).':s.mean<=90?'Øvre halvdel — følg trenden.':'Høyt — ta med til lege.','Stigende hvilepuls over uker er viktigst å merke seg.'],
  hrv:s=>['Din egen baseline betyr mest. Fallende = mindre restitusjon; se mot søvn + hvilepuls.'],
  sl:s=>[s.mean>=7?'Innenfor anbefalt 7–9 t.':s.mean>=6?'Litt under anbefalt.':'Under 6 t = kronisk kort søvn; påvirker HRV, puls, appetitt.'],
  vo2:s=>[s.mean<30?'Lavt for 60 år — men responderer best på jevn kondis.':s.mean<35?'Under middels — stigende er målet.':'Middels/godt for alderen.'],
  bps:s=>[s.mean<120?'Normalt (<120).':s.mean<130?'Litt forhøyet.':s.mean<140?'Forhøyet trinn 1.':'Høyt (≥140) — ta med til lege.','Enkeltmålinger svinger; trend + legens måling teller.'],
  prm:s=>[s.mean<120?'Under mål (150–180 g). Protein bevarer muskel i underskudd — prioriter.':s.mean<150?'Litt under mål.':'På/over mål — bra for muskelbevaring.'],
  kcm:s=>[s.mean<1600?'Under ramme (~1950). Ikke for stramt på treningsdager.':s.mean<=2100?'Innenfor ramme.':'Over ramme — juster ned hvis vekta står.'],
 };
 const body=(rules[k]||(()=>['Måledata over valgt periode.']))(st);
 return `<div class="card"><div class="rk" style="font-weight:800">🔎 Analyse</div><div class="muted small" style="margin:4px 0">Snitt ${fmt(st.mean,m.d)} ${m.u} · spenn ${fmt(st.min,m.d)}–${fmt(st.max,m.d)} · ${st.n} punkt</div><ul style="margin:6px 0 2px;padding-left:18px">${body.map(t=>`<li style="font-size:13px;margin:3px 0">${t}</li>`).join('')}</ul><div class="muted" style="font-size:11px;border-top:1px solid var(--line);margin-top:8px;padding-top:6px">Måledata-tolkning, ikke diagnose.</div></div>`;
}

/* ================= PAGE: KROPP ================= */
function pageKropp(){
 let h='<div class="pagetitle">Kropp & hjerte</div><div class="pagesub">Langtid · 12 års historikk</div>';
 const cards=[['w','Vekt',false],['bps','Blodtrykk systolisk',false],['rhr','Hvilepuls',false],['hrv','HRV natt',true],['vo2','VO₂max',true],['o2','SpO₂',true]];
 // BP special: latest sys/dia
 const bl=lastVal('bps',false),dl=lastVal('bpd',false);
 h+=`<div class="grid g3"><div class="stat" onclick="go('data','w')"><div class="k">Vekt nå</div><div class="v">${fmt(lastVal('w',false).v,1)}</div></div><div class="stat" onclick="go('data','bps')"><div class="k">Blodtrykk</div><div class="v" style="font-size:18px">${bl.v?Math.round(bl.v)+'/'+Math.round(dl.v||0):'–'}</div></div><div class="stat" onclick="go('data','vo2')"><div class="k">VO₂max</div><div class="v">${fmt(lastVal('vo2',false).v,1)}</div></div></div>`;
 cards.forEach(([k,t,hb])=>{const s=longSeries(k);if(!s.filter(p=>p[1]!=null).length)return;const st=stat(s.map(p=>p[1]).filter(x=>x!=null));h+=`<h2 class="sh">${t}</h2><div class="card"><div class="muted small">${st?fmt(st.min,MK[k].d)+'–'+fmt(st.max,MK[k].d)+' '+MK[k].u+' · snitt '+fmt(st.mean,MK[k].d):''}</div><div class="tap" onclick="openFull(longSeries('${k}'),'${t}',MK['${k}'].u,${hb})">${lineChart(s,hb,130)}</div><div class="taphint">👆 Trykk for fullskjerm (per år)</div></div>`});
 document.getElementById('p-kropp').innerHTML=h;
}

/* ================= PAGE: KOSTHOLD ================= */
function pageKost(){
 let h='<div class="pagetitle">Kosthold</div><div class="pagesub">Mål: ~'+MAAL.kcal+' kcal · '+MAAL.protein+' g protein</div>';
 // find last day with food
 let fday=null;for(let i=R.length-1;i>=0;i--){if(FOOD[R[i].d]){fday=R[i].d;break}}
 if(fday){const items=FOOD[fday];const tk=items.reduce((a,b)=>a+(+b.k||0),0),tp=items.reduce((a,b)=>a+(+b.p||0),0);
  h+=`<h2 class="sh">Siste loggførte dag · ${labelDay(fday)}</h2>`;
  h+=`<div class="grid"><div class="stat"><div class="k">Kalorier</div><div class="v">${fmt(tk,0)}<small>/${MAAL.kcal}</small></div>${bar(tk,MAAL.kcal)}</div><div class="stat"><div class="k">Protein</div><div class="v">${fmt(tp,0)}<small>/${MAAL.protein} g</small></div>${bar(tp,MAAL.protein)}</div></div>`;
  h+='<div class="card">'+items.map(f=>`<div class="li"><div class="nm" style="font-weight:550">${f.n}</div><div class="rt"><div class="b">${Math.round(f.k||0)} kcal</div><div class="dt">${fmt(f.p,1)} g protein</div></div></div>`).join('')+'</div>';
 }else h+='<div class="card muted small center" style="padding:20px">Ingen kosthold logget ennå. Fortell Claude hva du spiser, så føres det inn.</div>';
 // protein trend where logged
 const ps=R.filter(r=>r.prm!=null).map(r=>[r.d.slice(5),r.prm]);
 if(ps.length>1){h+='<h2 class="sh">Protein-trend (loggførte dager)</h2><div class="card">'+lineChart(ps,true,110)+'<div class="muted small" style="margin-top:6px">Mål-linje: '+MAAL.protein+' g. Protein bevarer muskel når du går ned i vekt.</div></div>'}
 document.getElementById('p-kost').innerHTML=h;
}
function bar(v,max){const p=Math.min(100,v/max*100);const c=p>=90?'var(--good)':p>=60?'var(--energy)':'var(--warn)';return `<div style="height:5px;background:var(--card2);border-radius:3px;margin-top:7px;overflow:hidden"><div style="width:${p}%;height:100%;background:${c}"></div></div>`}

/* ================= FULLSKJERM-GRAF med markør ================= */
let apx=null;
function openFull(series,title,unit,hb){
 if(!series||series.length<2||typeof ApexCharts==='undefined')return;
 const el=document.getElementById('cmodal');el.className='cmodal on';
 el.innerHTML=`<div class="chead"><div class="ctitle">${title}</div><button class="cclose" onclick="closeFull()">✕</button></div><div class="cwrap" id="cwrap" style="padding:4px"></div><div class="chelp">Dra fingeren for verdi · knip for å zoome · dobbelttrykk nullstiller</div>`;
 const data=series.map(p=>({x:p[0],y:(p[1]==null?null:Math.round(p[1]*100)/100)}));
 const col=(hb===false)?'#ff9f43':'#5b8cff', u=unit||'';
 apx=new ApexCharts(document.getElementById('cwrap'),{
  chart:{type:'area',height:'100%',background:'transparent',foreColor:'#8b98ad',toolbar:{show:false},zoom:{enabled:true,type:'x',autoScaleYaxis:true},animations:{enabled:false},fontFamily:'-apple-system,sans-serif'},
  theme:{mode:'dark'},
  series:[{name:title,data}],
  colors:[col],
  stroke:{width:2.5,curve:'straight'},
  fill:{type:'gradient',gradient:{shadeIntensity:1,opacityFrom:.4,opacityTo:0,stops:[0,100]}},
  dataLabels:{enabled:false},markers:{size:0,hover:{size:6}},
  grid:{borderColor:'#26303f',strokeDashArray:3,padding:{left:8,right:8}},
  xaxis:{type:'category',tickAmount:6,tickPlacement:'on',labels:{rotate:0,hideOverlappingLabels:true,style:{fontSize:'10px'}},axisTicks:{show:false},axisBorder:{show:false},crosshairs:{show:true,stroke:{color:col,width:1,dashArray:4}},tooltip:{enabled:false}},
  yaxis:{tickAmount:5,labels:{formatter:v=>(Math.round(v*10)/10).toLocaleString('no'),style:{fontSize:'10px'}}},
  tooltip:{theme:'dark',x:{show:true},y:{formatter:v=>fmt(v,1)+' '+u,title:{formatter:()=>title+': '}},marker:{show:true}},
 });
 apx.render();
}
function closeFull(){if(apx){try{apx.destroy()}catch(e){}apx=null}const el=document.getElementById('cmodal');el.className='cmodal';el.innerHTML=''}

/* ================= ROUTER ================= */
const PAGES={idag:pageIdag,trening:pageTrening,data:pageData,kropp:pageKropp,kost:pageKost};
function show(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));document.getElementById('p-'+p).classList.add('on');document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));try{PAGES[p]()}catch(e){document.getElementById('p-'+p).innerHTML='<div class="card warn">Feil: '+e.message+'</div>'}window.scrollTo(0,0)}
function go(p,metric){if(metric){dMetric=metric}show(p)}
document.querySelectorAll('#nav a').forEach(a=>a.addEventListener('click',()=>show(a.dataset.p)));
function boot(data){
 DATA=data;R=DATA.daily||[];WK=DATA.workouts||[];FOOD=DATA.food||{};STY=DATA.styrke||{};
 PLAN=DATA.ukeplan||[];PLANMAL=DATA.planmal||{};REC=DATA.anbefaling;MAAL=DATA.maal||MAAL;
 byDate=Object.fromEntries(R.map(r=>[r.d,r]));minD=R[0].d;maxD=R[R.length-1].d;
 document.getElementById('hsub').textContent=`${DATA.meta.days} dager · ${DATA.meta.workouts} økter · oppdatert ${DATA.meta.updated}`;
 document.getElementById('shell').style.display='none';document.getElementById('nav').style.display='flex';
 show('idag');
}
async function gunzipB64(b64){const bin=atob(b64),by=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);const st=new Blob([by]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(st).text());}
function shellMsg(html){const s=document.getElementById('shell');s.innerHTML=html;s.style.display='flex';document.getElementById('nav').style.display='none';}
async function loadData(){
 shellMsg('<div class="lbox"><div class="spin"></div><div class="muted">Henter helsedata…</div></div>');
 const {data,error}=await sb.rpc('helse_snapshot');
 if(error||!data){showLogin('Kunne ikke hente data'+(error?': '+error.message:'.'));return;}
 try{boot(await gunzipB64(data));}catch(e){shellMsg('<div class="lbox"><div class="muted">Feil ved lasting: '+e.message+'</div></div>');}
}
function showLogin(msg){
 shellMsg(`<div class="login"><div class="mono2">TH</div><h1>Terje · Helse</h1><p class="muted small">Logg inn for å se dataene</p>${msg?'<div class="lerr">'+msg+'</div>':''}<input id="lem" type="email" placeholder="E-post" value="terje@hystad.me" autocapitalize="off" autocomplete="username"><input id="lpw" type="password" placeholder="Passord" autocomplete="current-password"><button id="lbtn" onclick="doLogin()">Logg inn</button></div>`);
}
async function doLogin(){
 const em=document.getElementById('lem').value.trim(),pw=document.getElementById('lpw').value;
 const b=document.getElementById('lbtn');if(b){b.textContent='…';b.disabled=true;}
 const r=await sb.auth.signInWithPassword({email:em,password:pw});
 if(r.error){showLogin(/invalid/i.test(r.error.message||'')?'Feil e-post eller passord. Prøv igjen.':r.error.message);return;}
 loadData();
}
async function initApp(){
 if(!window.supabase){shellMsg('<div class="lbox"><div class="muted">Innlogging utilgjengelig.</div></div>');return;}
 sb=window.supabase.createClient(SBURL,SBKEY);
 const {data:{session}}=await sb.auth.getSession();
 if(session)loadData();else showLogin('');
}
initApp();
</script></body></html>
